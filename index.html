<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de Coordinadoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============ VARIABLES Y BASE ============ */
:root{--y:#FFC400;--y2:#FFF3BF;--k:#141414;--k2:#242424;--g1:#F3F3F0;--g2:#E4E4DF;--g3:#85857F;--t:#1B1B1B;
  --r:#D92D20;--o:#E98300;--gr:#1B9A55;--b:#2459C9;--rad:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--g1);color:var(--t);font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
/* ============ MENÚ LATERAL ============ */
.side{width:236px;background:var(--k);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:50;transition:transform .2s}
.brand{padding:20px 18px 16px;display:flex;gap:11px;align-items:center;font-weight:800;font-size:15px;line-height:1.2}
.brand small{display:block;font-weight:500;color:#9a9a94;font-size:11px}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:2px 0;border-radius:10px;color:#bdbdb7;cursor:pointer;font-weight:600;font-size:13.5px}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--k2);color:#fff}
.nav a.on{background:var(--y);color:var(--k)}
.side-f{padding:14px 18px;font-size:11px;color:#77776f;border-top:1px solid #2a2a2a}
.velo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
/* ============ BARRA SUPERIOR ============ */
.cont{margin-left:236px;min-height:100vh}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--g2);padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.top h1{font-size:19px;font-weight:800;flex:1;min-width:150px}
.ham{display:none;border:0;background:var(--g1);border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:18px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.filtros select{flex:1 1 130px;max-width:230px}
.bell{position:relative;border:0;background:var(--g1);border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:16px}
.bell span{position:absolute;top:-5px;right:-5px;background:var(--r);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 6px}
.bell span:empty{display:none}
main{padding:20px 24px 60px;max-width:1500px}
/* ============ CONTROLES ============ */
input,select,textarea{border:1px solid var(--g2);border-radius:9px;padding:8px 10px;background:#fff;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--k);box-shadow:0 0 0 3px var(--y2)}
input[readonly],input:disabled,select:disabled{background:var(--g1);color:#666}
textarea{min-height:64px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13.5px}
.btn-y{background:var(--y);color:var(--k)}.btn-y:hover{background:#f0b800}
.btn-k{background:var(--k);color:#fff}.btn-k:hover{background:#333}
.btn-o{background:#fff;border-color:var(--g2)}.btn-o:hover{border-color:var(--k)}
.btn-d{background:#fff;border-color:#f3c2be;color:var(--r)}.btn-d:hover{background:#fdecea}
.btn-s{padding:5px 10px;font-size:12.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.bar input,.bar select{width:auto;flex:0 1 180px}
.seg{display:inline-flex;background:var(--g1);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--k);color:#fff}
/* ============ TARJETAS / KPIs ============ */
.card{background:#fff;border-radius:var(--rad);box-shadow:var(--sh);padding:18px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp{margin-bottom:18px}
.grp>h4{font-size:11.5px;letter-spacing:.09em;color:var(--g3);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.grp>h4:before{content:"";width:18px;height:4px;border-radius:2px;background:var(--y)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border-radius:12px;padding:13px 14px;box-shadow:var(--sh);border-left:4px solid var(--g2)}
.kpi small{display:block;color:var(--g3);font-weight:600;font-size:11.5px}
.kpi b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.kpi.y{border-color:var(--y)}.kpi.r{border-color:var(--r)}.kpi.r b{color:var(--r)}.kpi.o{border-color:var(--o)}.kpi.g{border-color:var(--gr)}.kpi.k{border-color:var(--k)}
.cols{display:grid;gap:16px;margin-bottom:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c13{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.ch{position:relative;height:260px}
.grid-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cc-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.cc-h b{display:block;font-size:15px}.cc-h small{color:var(--g3)}
.cc-n{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;text-align:center}
.cc-n div{background:var(--g1);border-radius:9px;padding:7px 2px}
.cc-n b{display:block;font-size:16px}.cc-n small{font-size:10px;color:var(--g3);font-weight:600}
.cc-n .neg{background:#fdecea}.cc-n .neg b{color:var(--r)}
.cc-a{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog{height:8px;background:var(--g2);border-radius:99px;overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:var(--y);border-radius:99px}
.prog i.ok{background:var(--gr)}.prog i.lo{background:var(--r)}
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--y);color:var(--k);display:grid;place-items:center;font-weight:800}
.demo{font-size:9.5px;font-weight:800;background:var(--k);color:var(--y);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.banner{background:var(--y2);border:1px solid var(--y);border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.banner .sp{flex:1}
/* ============ TABLAS ============ */
.tw{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--g3);padding:9px 10px;border-bottom:2px solid var(--g2);white-space:nowrap}
.tb td{padding:9px 10px;border-bottom:1px solid var(--g1);vertical-align:middle}
.tb tr:hover td{background:#fafaf7}
.tb tr.venc td{background:#fff5f4}
.tb .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb tfoot td{font-weight:800;border-top:2px solid var(--k);border-bottom:0}
.tb input{padding:6px 8px;text-align:right;max-width:190px}
.vacio{text-align:center;color:var(--g3);padding:26px 10px}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-r{background:#fdecea;color:var(--r)}.b-o{background:#fff0dc;color:#b86200}.b-y{background:var(--y2);color:#7a5c00}.b-g{background:#e3f6ec;color:#12713d}.b-n{background:var(--g1);color:#555}.b-b{background:#e6edfb;color:var(--b)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--y);background:var(--y2);border-radius:12px;padding:26px 16px;margin-bottom:14px;cursor:pointer}
.drop b{font-size:17px}.drop span{color:#6b5a14;font-size:12.5px}.drop:hover,.drop.on{background:var(--y)}
/* logo */
.logo{flex:none;width:40px;height:40px;border-radius:10px;background:var(--y);color:var(--k);display:grid;place-items:center;font-weight:800;font-size:18px;cursor:pointer;overflow:hidden;position:relative}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.side .logo:hover:after{content:"✎";position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:15px}
.b-k{background:var(--k);color:var(--y)}
/* tablero de pendientes */
.pboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}
.pp{background:var(--g1);border-radius:12px;display:flex;flex-direction:column;max-height:600px;border:1px solid var(--g2)}
.pp-h{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--g2)}
.pp-h small{display:block;color:var(--g3);font-size:11.5px;font-weight:600}
.pp-i{width:36px;height:36px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:17px;flex:none}
.pp-c{margin-left:auto;background:var(--k);color:#fff;border-radius:99px;padding:2px 10px;font-weight:800;font-size:12px}
.pp.lid{background:var(--y2);border:2px solid var(--y)}.pp.lid .pp-h{background:var(--k);color:#fff;border-radius:10px 10px 0 0}.pp.lid .pp-h small{color:#bbb}.pp.lid .pp-c{background:var(--y);color:var(--k)}
.pp-b{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.pm{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:var(--sh);cursor:pointer;border-left:4px solid var(--g2);display:flex;flex-direction:column;gap:4px}
.pm:hover{outline:2px solid var(--y)}.pm small{color:var(--g3);font-size:12px}.pm .uc{background:var(--g1);border-radius:6px;padding:4px 6px;color:#555}
.pm.venc{border-color:var(--r)}.pm.hoy{border-color:var(--o)}.pm.prox{border-color:var(--y)}.pm.ok{border-color:var(--gr);opacity:.75}
/* visitas: pendientes */
.pend-box{background:var(--y2);border:1px solid var(--y);border-radius:12px;padding:12px}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--k);border-radius:10px;padding:10px 12px;margin-top:10px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--k)}.chk small{display:block;color:var(--g3);font-size:12px}
.gen{margin-top:10px;display:flex;flex-direction:column;gap:6px}.gen a{background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px}.gen a:hover{outline:2px solid var(--k)}
/* novedades: documentos requeridos */
.req{background:#fff8dc;border:1px solid var(--y);border-left:5px solid var(--y);border-radius:10px;padding:12px 14px}
.req h5{margin:0 0 4px;font-size:14px}.req p{margin:0 0 8px;font-size:12.5px;color:#5c4f1f}
.req-g{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px}.req-g>b{display:block;font-size:12px;margin-bottom:4px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:3px 0;cursor:pointer}.ck input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--gr)}
.vacio-r{color:var(--g3);background:var(--g1);border-color:var(--g2);border-left-color:var(--g3)}
.af{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--g2);border-radius:10px;margin-bottom:6px}
.af>div{flex:1;min-width:0}.af b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.af small{color:var(--g3);font-size:11.5px}
.fi{flex:none;font-size:10px;font-weight:800;border-radius:6px;padding:5px 6px;color:#fff}.fi.pdf{background:var(--r)}.fi.xls{background:var(--gr)}
/* documentos por mes */
.meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mes{border:1px solid var(--g2);background:var(--g1);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.mes b{display:block}.mes small{color:var(--g3);font-size:11.5px}.mes:hover{border-color:var(--k)}.mes.on{background:var(--k);color:#fff;border-color:var(--k)}.mes.on small{color:var(--y)}
/* matriz de provisiones */
.mat{max-height:68vh;overflow:auto;border:1px solid var(--g2);border-radius:10px}
.mat table{font-size:12.5px}.mat th{position:sticky;top:0;background:#fff;z-index:2}
.mat .fix{position:sticky;left:0;background:#fff;z-index:1;min-width:190px;max-width:230px;box-shadow:1px 0 0 var(--g2)}.mat th.fix{z-index:3}
.mat td.fix small{display:block;color:var(--g3);font-size:11px}
.mat td{padding:4px 4px}.mat .pc{width:100%;min-width:96px;max-width:none;padding:6px;text-align:right;border-color:transparent;background:transparent;font-variant-numeric:tabular-nums}
.mat .pc:hover{border-color:var(--g2);background:#fff}.mat .pc:focus{border-color:var(--k);background:#fff}
.mat .mact{background:#fffbe8}.mat tfoot td{position:sticky;bottom:0;background:var(--y2)}.mat tfoot .fix{background:var(--y2)}
.mat td.baja{background:#fdecea}.mat td.sube{background:#e3f6ec}.mat td{position:relative}
.mat td>i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9px}.mat td.baja>i{color:var(--r)}.mat td.sube>i{color:var(--gr)}
.lg{display:inline-block;border-radius:5px;padding:0 6px;font-weight:700}.lg.baja{background:#fdecea;color:var(--r)}.lg.sube{background:#e3f6ec;color:var(--gr)}
/* ============ FORMULARIOS / MODAL ============ */
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:block}.fld>span{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#444}
.full{grid-column:1/-1}
.sep{grid-column:1/-1;font-weight:800;border-top:1px solid var(--g2);padding-top:12px;margin-top:4px}
.acc{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.hint{color:var(--g3);font-size:12px;margin:6px 0 0}
.modal{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.ancho{max-width:980px}
.mbox header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--g2)}
.mbox header h3{flex:1;font-size:16px;font-weight:800}
.mbox header button{border:0;background:var(--g1);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}
.mbody{padding:18px 20px 20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--k);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;z-index:200;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;border-left:5px solid var(--y);max-width:90vw}
.toast.on{transform:translateX(-50%);opacity:1}.toast.err{border-color:var(--r)}
.foto-ed{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.tl{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.tl li{border-left:3px solid var(--y);padding:6px 0 6px 12px;margin-bottom:8px}
.tl li.sys{border-color:var(--g2);color:#666;font-size:12.5px}
.tl small{color:var(--g3);display:block}
.traza{font-size:11.5px;color:var(--g3);margin-top:12px}
/* ============ CALENDARIO ============ */
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:800;color:var(--g3);text-transform:uppercase;padding:6px 0}
.cal-h div{padding-left:6px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cd{background:var(--g1);border-radius:9px;min-height:104px;padding:5px;cursor:pointer;overflow:hidden}
.cd:hover{outline:2px solid var(--y)}
.cd.out{opacity:.45}.cd.hoy{background:var(--y2);outline:2px solid var(--y)}
.cd-n{font-weight:800;font-size:12px;display:block;margin-bottom:3px}
.chip{font-size:11px;border-radius:5px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;background:#fff;cursor:pointer}
.e-p{border-color:var(--y)}.e-r{border-color:var(--gr)}.e-x{border-color:var(--o)}.e-c{border-color:var(--g3);text-decoration:line-through;color:#888}
.mas{font-size:11px;font-weight:700;text-decoration:underline;cursor:pointer}
.cal-s{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-s>div{background:var(--g1);border-radius:10px;padding:8px;min-height:180px;cursor:pointer}
.cal-s>div.hoy{background:var(--y2)}
.cal-s h5{margin:0 0 8px;font-size:12px}
.vc{background:#fff;border-left:4px solid;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;box-shadow:var(--sh)}
.vc b{display:block;font-size:12.5px}.vc small{display:block;color:var(--g3);margin-bottom:3px}
.ley{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px}
.ley span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.al{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--g1)}
.al:last-child{border:0}.al>div{flex:1;min-width:0}.al small{color:var(--g3);display:block}
/* ============ RESPONSIVE ============ */
@media(max-width:1100px){.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.c13{grid-template-columns:1fr}}
@media(max-width:900px){
  .side{transform:translateX(-100%)}body.menu .side{transform:none}body.menu .velo{display:block}
  .cont{margin-left:0}.ham{display:block}.top{padding:10px 14px}main{padding:14px 12px 60px}
  .c2,.c3{grid-template-columns:1fr}.cal-s{grid-template-columns:1fr}.cal-s>div{min-height:0}
}
@media(max-width:600px){#btn-imp{font-size:0;gap:0}#btn-imp:before{content:'⬆ Excel';font-size:13px}.fg{grid-template-columns:1fr}.cd{min-height:62px}.chip{font-size:0;height:6px;padding:0;border-left-width:22px}.top h1{font-size:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:17px}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><label class="logo" title="Clic para cargar o cambiar el logo"><span id="logo">S</span><input type="file" accept="image/*" hidden onchange="cargarLogo(this)"></label><div>Seguimiento<small>Coordinadoras de proyectos</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-f">v1.0 · Datos guardados en este navegador</div>
</aside>
<div class="velo" onclick="document.body.classList.remove('menu')"></div>
<div class="cont">
  <header class="top">
    <button class="ham" onclick="document.body.classList.toggle('menu')" aria-label="Menú">☰</button>
    <h1 id="titulo"></h1>
    <label class="btn btn-y" id="btn-imp" title="Cargar o actualizar la base de clientes desde Excel">⬆ Importar Excel<input type="file" accept=".xlsx,.xls" hidden onchange="leerExcel(this)"></label>
    <button class="bell" onclick="ir('alertas')" title="Alertas">🔔<span id="n-al"></span></button>
    <div id="sesion" style="min-width:190px"></div>
    <div class="filtros" id="filtros"></div>
  </header>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"><header><h3 id="m-t"></h3><button onclick="cerrarModal()" aria-label="Cerrar">×</button></header><div class="mbody" id="m-b"></div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   PLATAFORMA DE SEGUIMIENTO DE COORDINADORAS
   Índice del código:
   1. Utilidades            6. Componentes de interfaz     11. Provisiones / Facturación
   2. Almacenamiento        7. Dashboard y Alertas         12. Inicio de operaciones

const $=(s,r=document)=>r.querySelector(s);

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoy=()=>iso(new Date());
const ahora=()=>new Date().toISOString();
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDias=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return iso(d)};
const diasEntre=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const fFecha=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'—';
const fFechaHora=s=>{if(!s)return'—';const d=new Date(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fNum=n=>Math.round(n||0).toLocaleString('es-CO');
const fCOP=n=>'$ '+fNum(n);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const parseMoney=s=>Number(String(s).replace(/[^\d-]/g,''))||0;
const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);

/* ---------- 4. REGLAS DE CÁLCULO ---------- */
/* Semáforo de pendientes: vencido (<hoy y no completado), vence hoy, próximo (≤3 días) */
function alerta(p){
  if(p.estado==='Completado')return{k:'ok',t:'Completado',cls:'b-g',ico:'🟢'};
  const d=diasEntre(hoy(),p.fechaLimite);
  if(d<0)return{k:'venc',t:'Vencido',cls:'b-r',ico:'🔴'};
  if(d===0)return{k:'hoy',t:'Vence hoy',cls:'b-o',ico:'🟠'};
  if(d<=3)return{k:'prox',t:'Vence próximamente',cls:'b-y',ico:'🟡'};
  return{k:'plazo',t:'En plazo',cls:'b-n',ico:'⚪'}}
const ORD_A={venc:0,hoy:1,prox:2,plazo:3,ok:4},ORD_P={Urgente:0,Alta:1,Normal:2};
const ordenCrit=a=>[...a].sort((x,y)=>ORD_A[alerta(x).k]-ORD_A[alerta(y).k]||ORD_P[x.prioridad]-ORD_P[y.prioridad]||x.fechaLimite.localeCompare(y.fechaLimite));
/* Visitas: programadas = todas menos canceladas; cumplimiento = realizadas / programadas */
function statsVis(vs){const prog=vs.filter(v=>v.estado!=='Cancelada').length,real=vs.filter(v=>v.estado==='Realizada').length;return{prog,real,pct:pct(real,prog)}}
function statsCoord(id){
  const ids=new Set(db.clientes.filter(c=>c.coordId===id).map(c=>c.id));
  const v=statsVis(db.visitas.filter(x=>ids.has(x.clienteId)&&enPeriodo(x.fecha)));
  const ps=db.pendientes.filter(p=>ids.has(p.clienteId)&&p.estado!=='Completado');
  return{clientes:ids.size,...v,pend:ps.length,venc:ps.filter(p=>alerta(p).k==='venc').length}}
const proxVisita=cid=>db.visitas.filter(v=>v.clienteId===cid&&v.fecha>=hoy()&&(v.estado==='Programada'||v.estado==='Reprogramada')).map(v=>v.fecha).sort()[0]||'';
const ultVisita=cid=>db.visitas.filter(v=>v.clienteId===cid&&v.estado==='Realizada').map(v=>v.fechaReal||v.fecha).sort().pop()||'';
/* Facturación del mes = ajuste registrado (con novedad) o, si no hay, el valor a facturar fijo del cliente */
let _fx=null;const fxMap=()=>_fx||(_fx=new Map(db.facturas.map(f=>[f.clienteId+'|'+f.anio+'|'+f.mes,f])));
const ajuste=(cid,an,m)=>fxMap().get(cid+'|'+Number(an)+'|'+Number(m));
function valorBase(c,an,m){if(!c||!Number(c.valorMensual)||c.estado==='Inactivo')return 0;const ym=`${an}-${pad(m)}`;
  if(c.fechaInicio&&c.fechaInicio.slice(0,7)>ym)return 0;if(c.fechaFin&&c.fechaFin.slice(0,7)<ym)return 0;return Number(c.valorMensual)}
function factMes(cid,an,m){const r=ajuste(cid,an,m);return r?Number(r.valor)||0:valorBase(cliente(cid),an,m)}
const ajustesVis=()=>{const ids=idsVis(),an=Number(S.f.anio);return db.facturas.filter(f=>ids.has(f.clienteId)&&f.anio===an).map(f=>({...f,base:valorBase(cliente(f.clienteId),an,f.mes)})).sort((a,b)=>a.mes-b.mes||nomCli(a.clienteId).localeCompare(nomCli(b.clienteId)))};
/* Financiero: la provisión es de ADICIONALES → total real = facturación + provisión */
function fin(ids,anio,mes){let prov=0,fact=0;anio=Number(anio);
  db.provisiones.forEach(p=>{if(ids.has(p.clienteId)&&p.anio===anio)prov+=mes?(p.valores[mes-1]||0):sum(p.valores)});
  ids.forEach(cid=>{if(mes)fact+=factMes(cid,anio,Number(mes));else for(let m=1;m<=12;m++)fact+=factMes(cid,anio,m)});
  return{prov,fact,real:prov+fact,pp:pct(prov,prov+fact)}}
function statsNov(ns){const a=ns.filter(n=>n.estado==='Abierto').length,s=ns.filter(n=>n.estado==='En seguimiento').length,o=ns.filter(n=>n.estado==='Solucionado').length;return{total:ns.length,a,s,o,pct:pct(o,ns.length)}}
/* Sistema de alertas */
function alertas(){
  const A=[],h=hoy(),ids=idsVis();
  pendVis().forEach(p=>{const a=alerta(p);if(a.k==='venc'||a.k==='hoy'||a.k==='prox')A.push({n:ORD_A[a.k],ico:a.ico,t:`Pendiente ${a.t.toLowerCase()}: ${p.descripcion}`,d:`${nomCli(p.clienteId)} · ${nomCoord(coordDe(p.clienteId))} · límite ${fFecha(p.fechaLimite)}`,fn:`formPendiente('${p.id}')`})});
  db.visitas.filter(v=>ids.has(v.clienteId)&&(v.estado==='Programada'||v.estado==='Reprogramada')).forEach(v=>{const d=diasEntre(h,v.fecha);
    if(d<0)A.push({n:1.5,ico:'🟠',t:`Visita sin registrar desde ${fFecha(v.fecha)}`,d:`${nomCli(v.clienteId)} · ${nomCoord(coordDe(v.clienteId))} · sigue como "${v.estado}"`,fn:`formVisita('${v.id}')`});
    else if(d<=3)A.push({n:4,ico:'📅',t:`Visita próxima: ${d===0?'hoy':fFecha(v.fecha)} ${v.hora||''}`,d:`${nomCli(v.clienteId)} · ${nomCoord(coordDe(v.clienteId))}`,fn:`formVisita('${v.id}')`})});
  db.novedades.filter(n=>ids.has(n.clienteId)&&n.estado==='Abierto').forEach(n=>A.push({n:3,ico:'🟠',t:`Novedad abierta: ${n.novedad}${n.persona?' · '+n.persona:''}`,d:`${nomCli(n.clienteId)} · ${fFecha(n.fecha)}`,fn:`formNovedad('${n.id}')`}));
  db.permisos.filter(p=>ids.has(p.clienteId)&&p.estado==='Pendiente de documentos').forEach(p=>A.push({n:3.8,ico:'📎',t:`Novedad sin documentos completos: ${p.nombre} (${p.tipo})`,d:`${nomCli(p.clienteId)} · desde ${fFecha(p.fechaDesde)}`,fn:`formPermiso('${p.id}')`}));
  const conVis=new Set(db.visitas.map(v=>v.clienteId));
  clientesVis().filter(c=>c.estado!=='Inactivo'&&!conVis.has(c.id)).forEach(c=>A.push({n:5,ico:'⚪',t:`Cliente sin visitas registradas: ${c.nombre}`,d:nomCoord(c.coordId),fn:`ir('calendario')`}));
  return A.sort((a,b)=>a.n-b.n)}

/* --- Importación: detección flexible de columnas (sin tildes ni mayúsculas) --- */
const CAMPOS=[
  {k:'codigo',t:'Código cliente',s:['codigo cliente','codigo','cod cliente','codigo del cliente','id cliente','nit','cod','id','ceco','codigo ceco','centro de costo','centro de costos']},
  {k:'nombre',t:'Cliente',req:1,s:['cliente','nombre cliente','nombre del cliente','razon social','empresa','nombre','clientes','nombre empresa','cuenta']},
  {k:'coordinadora',t:'Coordinadora',req:1,s:['coordinadora','coordinador','coordinadora asignada','coordinador asignado','coordinadora responsable','coordinadoras','coordinador a','coord','coordinadora de proyecto','coordinador de proyecto']},
  {k:'valorMensual',t:'Valor a facturar',s:['valor a facturar','valor facturar','valor mensual','facturacion mensual','valor facturacion','valor factura','valor del contrato','valor contrato','tarifa mensual','tarifa','facturacion','valor']},
  {k:'jefe',t:'Jefe',s:['jefe','jefe inmediato','jefe de operaciones','jefe operaciones','jefe de proyecto','jefe zona','lider','gerente','director','supervisor']}];
function mapear(headers){const H=headers.map(norm),us=new Set(),map={};
  for(const c of CAMPOS){const i=H.findIndex((h,j)=>!us.has(j)&&h&&c.s.includes(h));if(i>=0){map[c.k]=i;us.add(i)}}
  /* segunda pasada por coincidencia parcial; "Cliente" va al final para no capturar columnas ajenas */
  for(const k of ['coordinadora','jefe','valorMensual','codigo','nombre']){if(map[k]!==undefined)continue;const c=CAMPOS.find(x=>x.k===k);
    const i=H.findIndex((h,j)=>!us.has(j)&&h&&c.s.some(x=>x.length>=4&&h.includes(x)));if(i>=0){map[k]=i;us.add(i)}}
  return map}
/* Valor en pesos desde Excel: número, "$ 12.345.678", "12,345,678.00" o "12.345.678,50" */
function aDinero(v){if(typeof v==='number')return Math.round(v);let t=String(v??'').replace(/[^\d.,-]/g,'');if(!t)return 0;
  const m=t.match(/[.,](\d{1,2})$/);if(m)t=t.slice(0,-m[0].length);return Number(t.replace(/[.,]/g,''))||0}
function aFecha(v){if(v===''||v==null)return'';
  if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);return d&&d.y>1950?`${d.y}-${pad(d.m)}-${pad(d.d)}`:''}
  if(v instanceof Date)return iso(v);const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))return `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;return''}
function leerExcel(inp){const f=inp.files[0];try{inp.value=''}catch(e){}if(!f)return;if(!/\.xlsx?$/i.test(f.name))return toast('El archivo debe ser .xlsx o .xls','err');if(!window.XLSX)return toast('No se pudo cargar la librería de Excel (requiere internet)','err');
  const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});S.imp={wb,archivo:f.name,hoja:wb.SheetNames[0]};prepararHoja();previaImp()}catch(err){toast('No se pudo leer el archivo: '+err.message,'err')}};rd.readAsArrayBuffer(f)}
/* Busca la fila de encabezados entre las primeras 20 filas (por si el archivo trae títulos encima) */
function prepararHoja(){const I=S.imp,m=XLSX.utils.sheet_to_json(I.wb.Sheets[I.hoja],{header:1,defval:'',raw:true});let enc=0,pt=-1;
  for(let i=0;i<Math.min(m.length,20);i++){const n=Object.keys(mapear(m[i]||[])).length;if(n>pt){pt=n;enc=i}}
  I.m=m;I.enc=enc;I.headers=(m[enc]||[]).map(String);I.map=mapear(I.headers)}
function setEnc(n){const I=S.imp;I.enc=Math.max(0,Math.min(I.m.length-1,(Number(n)||1)-1));I.headers=(I.m[I.enc]||[]).map(String);I.map=mapear(I.headers);previaImp()}
function analizarImp(){const{m,enc,map}=S.imp,filas=[];let omit=0;const nc=new Map();
  const porCod=new Map(db.clientes.filter(c=>c.codigo).map(c=>[norm(c.codigo),c])),porNom=new Map(db.clientes.map(c=>[norm(c.nombre),c]));
  for(let i=enc+1;i<m.length;i++){const r=m[i]||[],g=k=>map[k]===undefined?'':(r[map[k]]??''),nombre=String(g('nombre')).trim();
    if(!nombre){if(r.some(x=>String(x).trim()))omit++;continue}
    const o={};CAMPOS.forEach(c=>{if(map[c.k]!==undefined)o[c.k]=c.k.startsWith('fecha')?aFecha(g(c.k)):c.k==='valorMensual'?aDinero(g(c.k)):String(g(c.k)).trim()});
    o._ex=(o.codigo&&porCod.get(norm(o.codigo)))||porNom.get(norm(nombre))||null;
    if(o.coordinadora&&!db.coordinadoras.some(c=>norm(c.nombre)===norm(o.coordinadora)))nc.has(norm(o.coordinadora))||nc.set(norm(o.coordinadora),o.coordinadora);filas.push(o)}
  return{filas,omit,nuevos:filas.filter(f=>!f._ex).length,act:filas.filter(f=>f._ex).length,nuevasCoord:[...nc.values()]}}
function previaImp(){const I=S.imp,A=analizarImp(),falta=CAMPOS.filter(c=>c.req&&I.map[c.k]===undefined),cols=CAMPOS.filter(c=>I.map[c.k]!==undefined);

   <div class="fg" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-bottom:14px">${CAMPOS.map(c=>campo(c.t+(c.req?' *':''),selCol(c))).join('')}</div>

/* ---------- 12b. ARCHIVOS ADJUNTOS (IndexedDB) ----------
   Los PDF y Excel se guardan en IndexedDB del navegador (soporta archivos grandes);
   los registros solo guardan id, nombre, tipo y tamaño. */
const Archivos={_db:null,
  abrir(){return this._db||(this._db=new Promise((ok,ko)=>{const r=indexedDB.open('seguimiento_archivos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))},
  async op(modo,fn){const d=await this.abrir();return new Promise((ok,ko)=>{const t=d.transaction('f',modo),r=fn(t.objectStore('f'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)})},
  put(id,blob){return this.op('readwrite',s=>s.put(blob,id))},get(id){return this.op('readonly',s=>s.get(id))},
  del(id){return this.op('readwrite',s=>s.delete(id))},limpiar(){return this.op('readwrite',s=>s.clear())}};
const fTam=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const extOk=(n,exts)=>exts.some(x=>n.toLowerCase().endsWith(x));
async function guardarArchivos(files){const out=[];
  for(const f of files){const id=uid();await Archivos.put(id,f);out.push({id,nombre:f.name,tipo:f.type||'',tam:f.size,fecha:ahora(),usuario:usuario()})}return out}
async function abrirArchivo(id,nombre,bajar){try{const b=await Archivos.get(id);if(!b)return toast('El archivo no está guardado en este navegador','err');
  const u=URL.createObjectURL(b);if(bajar||!/\.pdf$/i.test(nombre)){const a=document.createElement('a');a.href=u;a.download=nombre;a.click()}else window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
  catch(e){toast('No se pudo abrir el archivo','err')}}
const icoArch=n=>/\.pdf$/i.test(n)?'<span class="fi pdf">PDF</span>':'<span class="fi xls">XLS</span>';
const archFila=(a,del)=>`<div class="af">${icoArch(a.nombre)}<div><b>${esc(a.nombre)}</b><small>${fTam(a.tam)} · ${fFechaHora(a.fecha)} · ${esc(a.usuario)}</small></div>
  ${/\.pdf$/i.test(a.nombre)?`<button type="button" class="btn btn-o btn-s" onclick="abrirArchivo('${a.id}','${esc(a.nombre).replace(/'/g,'')}')">Ver</button>`:''}<button type="button" class="btn btn-o btn-s" onclick="abrirArchivo('${a.id}','${esc(a.nombre).replace(/'/g,'')}',1)">⬇ Descargar</button>${del?`<button type="button" class="btn btn-d btn-s" onclick="${del}">✕</button>`:''}</div>`;

function dReportes(){const D=datosPvF().slice(0,S.rep.grupo==='cliente'?15:99);grafico('r1',{type:'bar',data:{labels:D.map(r=>r.n.replace(' (DEMO)','').slice(0,22)),datasets:dsPF(D.map(r=>r.prov),D.map(r=>r.fact))},options:ejeCOP})}
/* Filas para exportación */
const filasClientes=()=>clientesVis().map(c=>({'Código cliente':c.codigo,'Cliente':c.nombre,'Coordinadora':nomCoord(c.coordId),'Jefe':c.jefe||'','Valor a facturar':Number(c.valorMensual)||0,'Proyecto':c.proyecto,'Ciudad':c.ciudad,'Dirección':c.direccion,'Estado':c.estado,'Fecha inicio':fFecha(c.fechaInicio),'Fecha final':fFecha(c.fechaFin),'Observaciones':c.observaciones}));
const filasVisitas=()=>visitasVis().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(v=>({'Cliente':nomCli(v.clienteId),'Coordinadora':nomCoord(coordDe(v.clienteId)),'Fecha':fFecha(v.fecha),'Hora':v.hora,'Tipo':v.tipo,'Objetivo':v.objetivo,'Estado':v.estado,'Fecha real':fFecha(v.fechaReal),'Comentarios':v.comentarios,'Hallazgos':v.hallazgos,'Compromisos':v.compromisos,'Observaciones':v.observaciones,'Creado':fFechaHora(v.creadoEn),'Actualizado':fFechaHora(v.actualizadoEn),'Usuario':v.actualizadoPor}));
const filasPendientes=()=>pendFiltrados().map(p=>({'Alerta':alerta(p).t,'Cliente':nomCli(p.clienteId),'Coordinadora':nomCoord(coordDe(p.clienteId)),'Pendiente':p.descripcion,'Responsable':p.responsable,'Fecha creación':fFechaHora(p.creadoEn),'Fecha límite':fFecha(p.fechaLimite),'Días restantes':p.estado==='Completado'?'':diasEntre(hoy(),p.fechaLimite),'Prioridad':p.prioridad,'Estado':p.estado,'Comentarios':(p.comentarios||[]).map(c=>`[${fFechaHora(c.fecha)}] ${c.usuario}: ${c.texto}`).join('\n')}));
const filasProvisiones=()=>{const ids=idsVis(),an=Number(S.f.anio);return db.provisiones.filter(p=>ids.has(p.clienteId)&&p.anio===an).map(p=>{const r={'Cliente':nomCli(p.clienteId),'Coordinadora':nomCoord(coordDe(p.clienteId)),'Año':p.anio};MESES.forEach((m,i)=>r[m]=p.valores[i]||0);r['Total anual']=sum(p.valores);return r})};
const filasFacturas=()=>{const an=Number(S.f.anio);return clientesVis().map(c=>{const r={'Cliente':c.nombre,'Coordinadora':nomCoord(c.coordId),'Año':an,'Valor base':Number(c.valorMensual)||0};MESES.forEach((m,i)=>r[m]=factMes(c.id,an,i+1));r['Total']=sum(MESES.map((_,i)=>factMes(c.id,an,i+1)));return r})};
const filasAjustes=()=>ajustesVis().map(a=>({'Cliente':nomCli(a.clienteId),'Mes':MESES[a.mes-1],'Año':a.anio,'Valor base':a.base,'Facturado':a.valor,'Diferencia':a.valor-a.base,'Novedad':a.motivoTipo||'','Detalle':a.motivo||'','N.º factura':a.numero||'','Registró':a.actualizadoPor,'Fecha':fFechaHora(a.actualizadoEn)}));
const filasNovedades=()=>novVis().map(n=>({'Fecha':fFecha(n.fecha),'Hora':n.hora,'Cliente':nomCli(n.clienteId),'Coordinadora':nomCoord(coordDe(n.clienteId)),'Persona':n.persona||'','Novedad':n.novedad,'Descripción':n.descripcion,'Cómo se solucionó':n.solucion,'Responsable':n.responsable,'Estado':n.estado,'Observaciones':n.observaciones,'Usuario':n.creadoPor}));
const filasPvF=()=>datosPvF().map(r=>({[{cliente:'Cliente',coord:'Coordinadora',mes:'Mes'}[S.rep.grupo]]:r.n,'Facturación':r.fact,'Provisión adicionales':r.prov,'Total real':r.real,'% adicionales':r.pp}));
const filasPermisos=()=>permVis().map(p=>{const it=reqItems(p.tipo);return{'Registro':fFechaHora(p.creadoEn),'Nombre':p.nombre,'C.C.':p.cc,'Cliente':nomCli(p.clienteId),'Coordinadora':nomCoord(coordDe(p.clienteId)),'Novedad':p.tipo,'Desde':fFecha(p.fechaDesde),'Hasta':fFecha(p.fechaHasta),'Documentos recibidos':`${(p.docsRecibidos||[]).filter(x=>it.includes(x)).length} de ${it.length}`,'Documentos faltantes':it.filter(x=>!(p.docsRecibidos||[]).includes(x)).join('\n'),'Adjuntos':(p.archivos||[]).map(a=>a.nombre).join(', '),'Estado':p.estado,'Observaciones':p.observaciones,'Usuario':p.creadoPor}});
const filasDocumentos=()=>docsVis().map(d=>({'Año':d.anio,'Mes':MESES[d.mes-1],'Archivo':d.archivo.nombre,'Categoría':d.categoria,'Cliente':d.clienteId?nomCli(d.clienteId):'General','Descripción':d.descripcion,'Tamaño':fTam(d.archivo.tam),'Cargado por':d.creadoPor,'Fecha de carga':fFechaHora(d.creadoEn)}));
const filasAuditoria=()=>db.auditoria.map(a=>({'Fecha':fFechaHora(a.fecha),'Usuario':a.usuario,'Módulo':a.modulo,'Acción':a.accion,'Detalle':a.detalle}));
function exportar(nombre,hojas,silencio){if(!window.XLSX)return toast('No se pudo cargar la librería de Excel (requiere internet)','err');
  const wb=XLSX.utils.book_new();Object.entries(hojas).forEach(([h,f])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(f.length?f:[{Información:'Sin registros'}]),h.slice(0,31)));
  XLSX.writeFile(wb,`${nombre}_${hoy()}.xlsx`);if(!silencio){auditar('Reportes','Exportación',nombre);guardar()}toast('Archivo Excel generado')}
function exportarTodo(){const g=S.rep.grupo;S.pfBak=S.pf;S.pf={coord:'',cliente:'',prioridad:'',estado:'',desde:'',hasta:'',alerta:'',q:''};
  exportar('Reporte_consolidado',{Clientes:filasClientes(),Visitas:filasVisitas(),Pendientes:filasPendientes(),Provisiones:filasProvisiones(),Facturación:filasFacturas(),'Novedades facturación':filasAjustes(),'Inicio de operaciones':filasNovedades(),'Novedades personal':filasPermisos(),'Prov vs Fact':filasPvF()});S.pf=S.pfBak;S.rep.grupo=g}

/* ---------- 14. CONFIGURACIÓN ---------- */
function vConfig(){const L=esLider(),nd=['coordinadoras','clientes','visitas','pendientes','provisiones','facturas','novedades','permisos'].reduce((t,k)=>t+db[k].filter(r=>r.demo).length,0);
  return `<div class="cols c2">
   <div class="card"><h3>Usuario y perfil</h3><p>Sesión actual: <b>${esc(usuario())}</b> · Perfil: ${badge(L?'Líder':'Coordinadora').replace('b-n','b-y')}</p>
    ${L?campo('Nombre del líder (aparece en comentarios y trazabilidad)',`<input value="${esc(db.config.lider)}" onchange="db.config.lider=this.value.trim()||'Líder de operaciones';guardar();render()">`):''}
    <p class="hint">Use el selector "Ver como" de la barra superior para cambiar de perfil. <b>Líder:</b> ve y administra todo. <b>Coordinadora:</b> ve solo sus clientes; registra visitas, pendientes, comentarios y novedades; provisiones y facturación en modo consulta. Aún no hay inicio de sesión con contraseña.</p></div>
   <div class="card"><h3>Datos de prueba</h3><p>${nd?`Hay <b>${nd}</b> registros de prueba marcados como <span class="demo">DEMO</span>.`:'No hay datos de prueba cargados.'}</p>
    ${L?`<div class="bar" style="margin:0">${nd?'<button class="btn btn-d" onclick="eliminarDemo()">Eliminar datos de prueba</button>':'<button class="btn btn-o" onclick="sembrarDemo();guardar();render()">Cargar datos de prueba</button>'}</div>`:''}</div>
   <div class="card"><h3>Logo</h3><div style="display:flex;gap:14px;align-items:center"><span class="logo" style="width:64px;height:64px;font-size:26px">${db.config.logo?`<img src="${db.config.logo}" alt="">`:'S'}</span><div class="bar" style="margin:0"><label class="btn btn-y">Cargar imagen<input type="file" accept="image/*" hidden onchange="cargarLogo(this)"></label>${db.config.logo?`<button class="btn btn-o" onclick="db.config.logo='';guardar();render()">Quitar logo</button>`:''}</div></div><p class="hint">También puedes hacer clic directamente sobre el icono junto a "Seguimiento" en el menú.</p></div>
   <div class="card"><h3>Copia de seguridad</h3><p class="hint" style="margin-top:0">La información se guarda en este navegador. Descarga una copia periódicamente o para pasarla a otro equipo. La copia no incluye los PDF y Excel adjuntos (Novedades y Documentos): esos quedan en este navegador.</p>
    <div class="bar" style="margin:0"><button class="btn btn-k" onclick="respaldo()">⬇ Descargar copia (.json)</button>${L?`<label class="btn btn-o">⬆ Restaurar copia<input type="file" accept=".json" hidden onchange="restaurar(this)"></label><button class="btn btn-d" onclick="reiniciar()">Borrar toda la información</button>`:''}</div></div>
   <div class="card"><h3>Conexión a base de datos (preparado)</h3><p class="hint" style="margin-top:0">Toda la lectura y escritura pasa por el objeto <b>Almacen</b> del código (funciones <i>cargar</i> y <i>guardar</i>). Para conectar Google Sheets, Firebase o Supabase se reemplazan esas dos funciones, sin tocar los módulos. Cada registro ya guarda usuario, fechas e historial.</p></div></div>
  ${L?`<div class="card"><h3>Trazabilidad · registro de acciones <span style="flex:1"></span><button class="btn btn-o btn-s" onclick="exportar('Trazabilidad',{Trazabilidad:filasAuditoria()})">⬇ Exportar</button></h3><div class="tw" style="max-height:420px;overflow:auto"><table class="tb"><thead><tr><th>Fecha</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
   ${db.auditoria.slice(0,200).map(a=>`<tr><td style="white-space:nowrap">${fFechaHora(a.fecha)}</td><td>${esc(a.usuario)}</td><td>${esc(a.modulo)}</td><td>${esc(a.accion)}</td><td>${esc(a.detalle)}</td></tr>`).join('')||'<tr><td colspan="5" class="vacio">Aún no hay acciones registradas.</td></tr>'}</tbody></table></div><p class="hint">Se muestran las últimas 200 acciones de ${db.auditoria.length}.</p></div>`:''}`}
function respaldo(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download=`copia_seguimiento_${hoy()}.json`;a.click();toast('Copia descargada')}
function restaurar(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.clientes)||!d.config)throw 0;if(!confirm('Esto reemplaza toda la información actual por la de la copia. ¿Continuar?'))return;db=Object.assign(baseVacia(),d);guardar();toast('Copia restaurada');render()}catch(e){toast('El archivo no es una copia válida','err')}};rd.readAsText(f)}
function reiniciar(){if(!confirm('Se borrará TODA la información de la plataforma en este navegador. Esta acción no se puede deshacer. ¿Continuar?'))return;db=baseVacia();Archivos.limpiar().catch(()=>{});guardar();S.f.coord=S.f.cliente='';toast('Información eliminada');render()}

/* ---------- 15. NAVEGACIÓN E INICIO ---------- */
const VISTAS={dashboard:{t:'Dashboard',h:vDashboard,d:dDashboard},coordinadoras:{t:'Coordinadoras',h:vCoordinadoras},clientes:{t:'Base de clientes',h:vClientes},calendario:{t:'Calendario de visitas',h:vCalendario},
  pendientes:{t:'Pendientes',h:vPendientes},provisiones:{t:'Provisiones',h:vProvisiones},facturacion:{t:'Facturación',h:vFacturacion},inicio:{t:'Inicio de operaciones',h:vInicio,d:dInicio},permisos:{t:'Novedades',h:vPermisos},documentos:{t:'Documentos',h:vDocumentos},
  reportes:{t:'Reportes',h:vReportes,d:dReportes},config:{t:'Configuración',h:vConfig},alertas:{t:'Alertas',h:vAlertas}};
function ir(v,mantener){if(!mantener)S.detalle='';S.vista=v;document.body.classList.remove('menu');cerrarModal();render();window.scrollTo(0,0)}
function setF(k,v){S.f[k]=k==='cliente'||k==='coord'?v:(v===''?'':Number(v));if(k==='coord')S.f.cliente='';render()}
function cambiarSesion(v){db.config.sesion=v==='lider'?{rol:'lider',coordId:''}:{rol:'coord',coordId:v};S.f.coord=S.f.cliente='';S.detalle='';guardar();render();toast('Viendo como: '+usuario())}
function renderTop(){const s=db.config.sesion;
  $('#nav').innerHTML=Object.entries(VISTAS).filter(([k])=>k!=='alertas').map(([k,v])=>`<a class="${S.vista===k?'on':''}" onclick="ir('${k}')">${ico(k)}${v.t}</a>`).join('');
  $('#titulo').textContent=VISTAS[S.vista].t;$('#logo').innerHTML=db.config.logo?`<img src="${db.config.logo}" alt="Logo">`:'S';
  $('#filtros').innerHTML=`<select title="Año" onchange="setF('anio',this.value)">${opts(anios(),S.f.anio)}</select>
   <select title="Mes" onchange="setF('mes',this.value)"><option value="">Todos los meses</option>${opts(MESES.map((m,i)=>[i+1,m]),S.f.mes)}</select>
   <select title="Coordinadora" onchange="setF('coord',this.value)" ${s.rol==='coord'?'disabled':''}>${optsCoord(coordFiltro(),'Todas las coordinadoras')}</select>
   <select title="Cliente" onchange="setF('cliente',this.value)">${optsCli(db.clientes.filter(c=>!coordFiltro()||c.coordId===coordFiltro()),S.f.cliente,'Todos los clientes')}</select>`;
  $('#sesion').innerHTML=`<select title="Ver como" onchange="cambiarSesion(this.value)"><option value="lider">👤 Líder · ${esc(db.config.lider)}</option>${opts(db.coordinadoras.map(c=>[c.id,'Coordinadora · '+c.nombre]),s.coordId)}</select>`;
  $('#n-al').textContent=alertas().length||'';$('#btn-imp').style.display=esLider()?'':'none'}
function render(){
  S.charts.forEach(c=>c.destroy());S.charts=[];
  if(db.config.sesion.rol==='coord'&&!coord(db.config.sesion.coordId))db.config.sesion={rol:'lider',coordId:''};
  const v=VISTAS[S.vista];
  $('#main').innerHTML=(hayDemo()?`<div class="banner">🧪 Estás viendo <b>datos de prueba</b> (marcados como DEMO).<span class="sp"></span>${esLider()?'<button class="btn btn-y btn-s" onclick="ir(\'clientes\')">Cargar mi Excel de clientes</button><button class="btn btn-k btn-s" onclick="eliminarDemo()">Eliminar datos de prueba</button>':''}</div>`:'')+v.h();
  renderTop();if(v.d)requestAnimationFrame(v.d)}
/* Arranque: primera vez → base vacía + datos de prueba */
if(!db){db=baseVacia();sembrarDemo();guardar()}else db=Object.assign(baseVacia(),db);
/* Migración v2: la facturación pasa a valor fijo por cliente + ajustes con novedad */
if((db.version||1)<2){const v={};db.facturas.filter(f=>f.demo).forEach(f=>(v[f.clienteId]=v[f.clienteId]||[]).push(f.valor));
  db.clientes.forEach(c=>{if(c.demo&&!Number(c.valorMensual)&&v[c.id])c.valorMensual=Math.round(sum(v[c.id])/v[c.id].length/1e5)*1e5});
  db.facturas=db.facturas.filter(f=>!f.demo);db.version=2;guardar()}
if(window.Chart){Chart.defaults.font.family="'Manrope',system-ui,sans-serif";Chart.defaults.color='#555'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal()});
render();
</script>
</body>
</html>
